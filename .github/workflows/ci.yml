name: Quality checks

"on":
  push:
  pull_request:

concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate independent IPA gold corpus structure
        run: python scripts/ipa_gold_corpus.py validate --language khmer

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Python tests
        run: pytest -q

      - name: Verify generated Google phonemic lexicon shards
        run: python scripts/build_google_phonemic_lexicon.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web checks
        run: npm run check

      - name: Run Python and JavaScript structural parity tests
        run: npm run test:parity

      - name: Run Python and JavaScript lexical fixture parity tests
        run: npm run test:lexical-parity

      - name: Run Python and JavaScript consonant rule output parity tests
        run: npm run test:rule-parity

      - name: Run Python and JavaScript segmentation candidate parity tests
        run: npm run test:segmentation-parity

      - name: Benchmark deterministic Python and JavaScript engines
        run: npm run bench:engine

      - name: Benchmark browser tokenizer
        run: npm run bench:tokenizer

      - name: Build site
        run: npm run build

  export-browser-model:
    if: github.ref == 'refs/heads/feat/browser-local-mekongphon-ipa-20261125' || github.head_ref == 'feat/browser-local-mekongphon-ipa-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mekongphon-browser-export.txt
      - name: Restore pinned model export cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: dist/mekongphon
          key: mekongphon-${{ runner.os }}-${{ hashFiles('scripts/export_mekongphon_onnx.py', 'requirements-mekongphon-browser-export.txt') }}
      - name: Install pinned export toolchain
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-mekongphon-browser-export.txt
      - name: Export pinned model and verify ONNX Runtime parity
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/export_mekongphon_onnx.py --output-dir dist/mekongphon
      - name: Set up Node.js for tokenizer parity
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify browser tokenizer against pinned Transformers tokenizers
        run: node tests/mekongphon-browser-tokenizer.test.mjs dist/mekongphon
      - name: Stage model assets for the browser production test
        run: mkdir -p public/models && cp -a dist/mekongphon public/models/mekongphon
      - name: Vendor integrity-pinned ONNX Runtime Web
        run: node scripts/vendor_onnxruntime_web.mjs public/vendor/onnxruntime-web
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build model-enabled browser app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise on-device model in Chromium
        run: npm run test:browser
      - name: Upload browser model proof-of-port
        uses: actions/upload-artifact@v6
        with:
          name: mekongphon-browser-onnx-${{ github.sha }}
          path: dist/models/mekongphon/
          if-no-files-found: error
          retention-days: 14

  distillation-source-matrix:
    if: github.ref == 'refs/heads/feat/deterministic-neural-distillation-20261125' || github.head_ref == 'feat/deterministic-neural-distillation-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mekongphon-browser-export.txt

      - name: Install pinned teacher inference toolchain
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-mekongphon-browser-export.txt

      - name: Compare greedy and beam4 MekongPhon output with the source-attested matrix
        run: python scripts/benchmark_mekongphon_source_matrix.py --output dist/mekongphon-source-matrix-report.json

      - name: Upload aggregate-only diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: mekongphon-source-matrix-${{ github.sha }}
          path: dist/mekongphon-source-matrix-report.json
          if-no-files-found: error
          retention-days: 14

  nckl-phonemizer-bridge:
    if: github.ref == 'refs/heads/feat/deterministic-neural-distillation-20261125' || github.head_ref == 'feat/deterministic-neural-distillation-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned NCKL model and deterministic phonemizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
          python -m pip install "huggingface-hub==0.26.2" "safetensors==0.4.5" "khmer-g2p==0.1.0"
          python -m pip install -e ".[phonemizer]"

      - name: Compare direct IPA phonemizer with NCKL-respelling bridge
        run: python scripts/benchmark_nckl_phonemizer_bridge.py --output dist/nckl-phonemizer-bridge-report.json

      - name: Upload aggregate-only bridge diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: nckl-phonemizer-bridge-${{ github.sha }}
          path: dist/nckl-phonemizer-bridge-report.json
          if-no-files-found: error
          retention-days: 14

  google-phonemic-teacher:
    if: github.ref == 'refs/heads/feat/deterministic-neural-distillation-20261125' || github.head_ref == 'feat/deterministic-neural-distillation-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-google-teacher.txt

      - name: Install project test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Install pinned CPU-only neural teacher runtime
        run: python -m pip install -r requirements-google-teacher.txt

      - name: Train word-disjoint Google Khmer phonemic teacher
        run: python scripts/train_google_phonemic_teacher.py --epochs 12 --batch-size 192 --embedding-size 96 --hidden-size 128 --output-dir dist/google-khmer-teacher

      - name: Distill teacher predictions into a deterministic OOV syllable candidate table
        run: python scripts/distill_google_teacher.py --checkpoint dist/google-khmer-teacher/teacher.pt --output-dir dist/google-khmer-teacher --batch-size 192

      - name: Validate static deterministic candidate artifact and evidence limits
        run: python scripts/validate_google_distilled_syllables.py dist/google-khmer-teacher/distilled-syllables.json

      - name: Upload offline teacher and deterministic distillation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: google-khmer-phonemic-teacher-${{ github.sha }}
          path: |
            dist/google-khmer-teacher/teacher.pt
            dist/google-khmer-teacher/metrics.json
            dist/google-khmer-teacher/distilled-syllables.json
            dist/google-khmer-teacher/distillation-metrics.json
          if-no-files-found: error
          retention-days: 14

  pages-build-check:
    if: github.ref == 'refs/heads/feat/deterministic-neural-distillation-20261125' || github.head_ref == 'feat/deterministic-neural-distillation-20261125'
    needs: google-phonemic-teacher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download exact-head teacher and distillation artifact
        uses: actions/download-artifact@v6
        with:
          name: google-khmer-phonemic-teacher-${{ github.sha }}
          path: dist/google-khmer-teacher

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Stage static deterministic candidate table
        run: |
          mkdir -p public/data
          cp dist/google-khmer-teacher/distilled-syllables.json public/data/google-neural-distilled-syllables.json
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("public/data/google-neural-distilled-syllables.json").read_text(encoding="utf-8"))
          assert artifact.get("schema") == "google-khmer-neural-distilled-syllables/v1"
          assert len(artifact.get("candidates", [])) == 2532
          print("staged deterministic OOV table:", len(artifact["candidates"]), "candidates")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production web checks
        run: npm run check

      - name: Build production Pages site with the real distilled table
        run: |
          npm run build
          test -s dist/data/google-neural-distilled-syllables.json
          cmp public/data/google-neural-distilled-syllables.json dist/data/google-neural-distilled-syllables.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production page in Chromium with the real static table
        run: npm run test:browser
