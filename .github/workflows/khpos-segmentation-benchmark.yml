name: External khPOS segmentation benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/khpos-segmentation-benchmark.yml"
      - "scripts/evaluate_khpos.py"
      - "scripts/evaluate_khpos_js.mjs"
      - "src/khmer_ua/word_segmenter.py"
      - "src/khmer_ua/rule_engine.py"
      - "src/khmer-word-segmenter.js"
      - "src/khmer-engine-core.js"
      - "data/khmer/google-pronunciation-full-frequency.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/khpos-segmentation-benchmark.yml"
      - "scripts/evaluate_khpos.py"
      - "scripts/evaluate_khpos_js.mjs"
      - "src/khmer_ua/word_segmenter.py"
      - "src/khmer_ua/rule_engine.py"
      - "src/khmer-word-segmenter.js"
      - "src/khmer-engine-core.js"
      - "data/khmer/google-pronunciation-full-frequency.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Python project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Run non-bundled khPOS open-test benchmark
        run: python scripts/evaluate_khpos.py
