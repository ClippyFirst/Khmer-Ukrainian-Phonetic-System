name: Optional Khmer Phonemizer raw-output diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/benchmark_g2p.py"
      - "src/khmer_ua/hybrid.py"
      - "tests/test_hybrid_engine.py"
      - "pyproject.toml"
      - "data/tests/verified-lexical-corpus.json"
      - ".github/workflows/optional-khmerphonemizer-smoke.yml"
  pull_request:
    paths:
      - "scripts/benchmark_g2p.py"
      - "tests/test_benchmark_g2p.py"
      - "data/tests/verified-lexical-corpus.json"
      - ".github/workflows/optional-khmerphonemizer-smoke.yml"

permissions:
  contents: read

jobs:
  raw-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned optional Khmer Phonemizer
        run: python -m pip install -e . "khmerphonemizer==0.0.3"
      - name: Capture raw output and source-attested diagnostics (never accuracy)
        run: |
          python scripts/benchmark_g2p.py \
            --output artifacts/external-g2p/khmer-phonemizer.json
      - name: Exercise the shared hybrid IPA and Ukrainian adapter on the reported phrase
        run: |
          mkdir -p artifacts/hybrid
          python - <<'PY'
          import json
          from pathlib import Path
          from khmer_ua import create_hybrid_engine

          source = "កម្ពុជាប្រជាធិបតេយ្យ"
          result = create_hybrid_engine(include_khmerphonemizer=True).analyze(source)
          payload = {
              "source": source,
              "hybrid_engine": result["hybrid_engine"],
              "canonical_ipa": result.get("ipa"),
              "canonical_ukrainian": result.get("ukrainian"),
              "provisional_candidate": result.get("provisional_candidate"),
              "external_candidates": result.get("external_candidates", []),
              "backend_failures": result.get("backend_failures", []),
              "interpretation": "Raw optional provider diagnostic; not an accuracy score or adjudicated gold.",
          }
          Path("artifacts/hybrid/khmer-phonemizer-hybrid-candidate.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic report, hybrid candidate and integrity digest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: khmer-phonemizer-raw-output
          path: |
            artifacts/external-g2p/khmer-phonemizer.json*
            artifacts/hybrid/khmer-phonemizer-hybrid-candidate.json
          if-no-files-found: warn
          retention-days: 30
