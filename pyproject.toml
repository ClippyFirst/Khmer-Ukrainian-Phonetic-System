[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "khmer-ukrainian-phonetic-system"
version = "0.2.0"
description = "Evidence-backed Khmer to Ukrainian phonetic-graphemic correspondence reference implementation"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.20,<5"]
phonemizer = ["khmerphonemizer==0.0.3"]
epitran = ["epitran==1.35.1"]
mekongphon = ["torch==2.5.1", "transformers==4.46.3", "tokenizers==0.20.3", "huggingface-hub==0.26.2", "safetensors==0.4.5"]

[project.scripts]
khmer-ua = "khmer_ua.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
