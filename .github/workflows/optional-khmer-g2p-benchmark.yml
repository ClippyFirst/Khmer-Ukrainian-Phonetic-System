name: Optional Khmer G2P smoke benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/khmer_ua/hybrid.py"
      - "tests/test_hybrid_engine.py"
      - "pyproject.toml"
      - ".github/workflows/optional-khmer-g2p-benchmark.yml"

permissions:
  contents: read

jobs:
  mekongphon-neural-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: byu-matrix-lab/MekongPhon
          ref: f80f6c1840c4818b51e05f2e00cded4701a5b662
          path: mekongphon
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned CPU inference runtime
        run: |
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
          python -m pip install "transformers==4.46.3" "tokenizers==0.20.3" "huggingface-hub==0.26.2" "safetensors==0.4.5"
      - name: Run the pinned MekongPhon Khmer IPA model
        run: |
          mkdir -p artifacts
          python scripts/benchmark_mekongphon_model.py \
            --corpus mekongphon/data/splits/khmer_eval.csv \
            --output artifacts/khmer-mekongphon-neural-raw-output.json
      - name: Run the pinned MekongPhon adapter on the reported phrase
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from khmer_ua import create_hybrid_engine

          source = "កម្ពុជាប្រជាធិបតេយ្យ"
          result = create_hybrid_engine(include_mekongphon=True).analyze(source)
          payload = {
              "source": source,
              "hybrid_engine": result["hybrid_engine"],
              "canonical_ipa": result.get("ipa"),
              "canonical_ukrainian": result.get("ukrainian"),
              "provisional_candidate": result.get("provisional_candidate"),
              "external_candidates": result.get("external_candidates", []),
              "backend_failures": result.get("backend_failures", []),
              "interpretation": "Raw optional model diagnostic; not an accuracy score or adjudicated gold.",
          }
          Path("artifacts/khmer-mekongphon-hybrid-candidate.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Upload model and hybrid diagnostics (no source corpus rows)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: khmer-mekongphon-neural-raw-output
          path: |
            artifacts/khmer-mekongphon-neural-raw-output.json*
            artifacts/khmer-mekongphon-hybrid-candidate.json
          if-no-files-found: warn
          retention-days: 90
