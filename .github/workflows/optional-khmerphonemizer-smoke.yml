name: Optional Khmer Phonemizer raw-output diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/benchmark_g2p.py"
      - "src/khmer_ua/hybrid.py"
      - "tests/test_hybrid_engine.py"
      - "pyproject.toml"
      - "data/tests/verified-lexical-corpus.json"
      - ".github/workflows/optional-khmerphonemizer-smoke.yml"
  pull_request:
    paths:
      - "scripts/benchmark_g2p.py"
      - "src/khmer_ua/hybrid.py"
      - "tests/test_hybrid_engine.py"
      - "pyproject.toml"
      - "tests/test_benchmark_g2p.py"
      - "data/tests/verified-lexical-corpus.json"
      - ".github/workflows/optional-khmerphonemizer-smoke.yml"

permissions:
  contents: read

jobs:
  raw-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned optional Khmer Phonemizer
        run: python -m pip install -e ".[test,phonemizer]"
      - name: Capture raw output and source-attested diagnostics (never accuracy)
        run: |
          python scripts/benchmark_g2p.py \
            --output artifacts/external-g2p/khmer-phonemizer.json
      - name: Exercise the shared hybrid IPA and Ukrainian adapter
        run: |
          mkdir -p artifacts/hybrid
          python - <<'PY'
          import json
          from pathlib import Path
          from khmer_ua import RuleBasedKhmerEngine, create_hybrid_engine

          source = "កម្ពុជាប្រជាធិបតេយ្យ"
          canonical = RuleBasedKhmerEngine().analyze(source)
          result = create_hybrid_engine(include_khmerphonemizer=True).analyze(source)
          candidate = result["provisional_candidate"]
          assert candidate is not None, "provider did not yield a validated IPA candidate"
          assert candidate["provider"] == "khmer-phonemizer"
          assert candidate["status"] == "PROVISIONAL"
          assert candidate["profile_match"] == "UNVERIFIED"
          assert candidate["ipa"]
          assert result["ipa"] == canonical["ipa"], "external candidate must not overwrite canonical IPA"
          assert result["ukrainian"] == canonical["ukrainian"], "external candidate must not overwrite canonical Ukrainian"
          payload = {
              "source": source,
              "canonical_ipa": result["ipa"],
              "canonical_ukrainian": result["ukrainian"],
              "provisional_candidate": candidate,
              "interpretation": "Provider smoke only; not expert adjudication or an accuracy score.",
          }
          Path("artifacts/hybrid/khmer-phonemizer-hybrid-candidate.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic report and integrity digest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: khmer-phonemizer-raw-output
          path: |
            artifacts/external-g2p/khmer-phonemizer.json*
            artifacts/hybrid/khmer-phonemizer-hybrid-candidate.json
          if-no-files-found: warn
          retention-days: 30
