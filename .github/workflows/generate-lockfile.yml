name: Generate reproducible npm lockfile

on:
  push:
    branches:
      - beta/khmer-reproducible-deps-2026-11-21

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve exact dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "build: lock exact npm dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
