name: MekongPhon source-matrix diagnostic

on:
  pull_request:
    paths:
      - scripts/benchmark_mekongphon_source_matrix.py
      - data/khmer/vowel-context-register.json
      - requirements-mekongphon-browser-export.txt
      - .github/workflows/mekongphon-source-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mekongphon-source-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mekongphon-browser-export.txt

      - name: Install pinned teacher inference toolchain
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-mekongphon-browser-export.txt

      - name: Compare greedy MekongPhon output with the source-attested matrix
        run: python scripts/benchmark_mekongphon_source_matrix.py --output dist/mekongphon-source-matrix-report.json

      - name: Upload aggregate-only diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: mekongphon-source-matrix-${{ github.sha }}
          path: dist/mekongphon-source-matrix-report.json
          if-no-files-found: error
          retention-days: 14
