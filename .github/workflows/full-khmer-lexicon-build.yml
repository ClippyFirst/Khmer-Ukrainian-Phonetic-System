name: Full Khmer lexicon rebuild

on:
  push:
    branches:
      - main
      - feat/khmer-full-frequency-dictionary-2026-11-23
    paths:
      - data/khmer/google-pronunciation-full.tsv
      - .github/workflows/full-khmer-lexicon-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-full-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Check out pinned upstream builder
        env:
          UPSTREAM_REVISION: 31b72cd4665f69678fc835da2f501771e42f097a
        run: |
          git clone --filter=blob:none https://github.com/pheasaKhmer/khmer-engine.git "$RUNNER_TEMP/khmer-engine"
          git -C "$RUNNER_TEMP/khmer-engine" checkout --detach "$UPSTREAM_REVISION"

      - name: Verify bundled Google source and build full dictionary
        working-directory: ${{ runner.temp }}/khmer-engine
        run: |
          mkdir -p data/raw
          cp "${{ github.workspace }}/data/khmer/google-pronunciation-full.tsv" data/raw/google-km-lexicon.tsv
          python - <<'PY'
          import hashlib
          from pathlib import Path

          source = Path("data/raw/google-km-lexicon.tsv")
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          expected = "b3f2e700d07d6c01a4c8cac5aa2f13b9a66885668ac482cc0c513f73c56495e5"
          if actual != expected:
              raise SystemExit(f"Google source SHA-256 mismatch: {actual}")
          print(f"Google source SHA-256 verified: {actual}")
          PY
          uv sync --locked --group data
          uv run --locked --group data python scripts/build_data.py --raw data/raw --out "${{ runner.temp }}/khmer-full-build" --workers 8

      - name: Validate generated dictionary and emit compact frequency table
        env:
          OUTPUT_DIR: ${{ runner.temp }}/khmer-full-build
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          lexicon = output / "lexicon.tsv"
          bigrams = output / "bigrams.tsv"
          frequency = output / "segmentation-frequency.tsv"

          full_counts = {}
          for line in lexicon.read_text(encoding="utf-8").splitlines():
              if not line.strip() or line.startswith("#"):
                  continue
              word, count, *_ = line.split("\t")
              if word in full_counts:
                  raise SystemExit(f"Duplicate normalized word: {word}")
              value = int(count)
              if value < 0:
                  raise SystemExit(f"Negative frequency for {word}")
              full_counts[word] = value

          if len(full_counts) != 61980:
              raise SystemExit(f"Expected 61,980 normalized words, got {len(full_counts)}")

          sample_path = Path(os.environ["GITHUB_WORKSPACE"]) / "data/khmer/google-pronunciation-sample.json"
          sample = json.loads(sample_path.read_text(encoding="utf-8"))
          sample_counts = {item["word"]: int(item["count"]) for item in sample["entries"]}
          missing = sorted(set(sample_counts) - set(full_counts))
          mismatched = sorted(
              word for word, count in sample_counts.items()
              if word in full_counts and full_counts[word] != count
          )
          if missing or mismatched:
              raise SystemExit(
                  f"Full dictionary does not preserve sample: missing={len(missing)}, "
                  f"count_mismatches={len(mismatched)}; first_missing={missing[:5]}, "
                  f"first_mismatched={mismatched[:5]}"
              )

          with frequency.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("# Full Khmer segmentation word-frequency table.\n")
              handle.write("# Words: Google Khmer pronunciation lexicon, CC BY 4.0.\n")
              handle.write("# Counts: FineWeb-2 khm_Khmr test split, ODC-By 1.0.\n")
              handle.write("# Builder: pheasaKhmer/khmer-engine@31b72cd4665f69678fc835da2f501771e42f097a.\n")
              handle.write("# Only word and count fields are retained; phonemic strings are excluded.\n")
              handle.write("# word\tcount\n")
              for word, count in full_counts.items():
                  handle.write(f"{word}\t{count}\n")

          bigram_count = sum(
              1 for line in bigrams.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.startswith("#")
          )
          if bigram_count < 1:
              raise SystemExit("No bigram rows were generated")

          frequency_bytes = frequency.read_bytes()
          summary = {
              "upstream_repository": "https://github.com/pheasaKhmer/khmer-engine",
              "upstream_revision": "31b72cd4665f69678fc835da2f501771e42f097a",
              "google_source": "data/khmer/google-pronunciation-full.tsv",
              "google_source_expected_sha256": "b3f2e700d07d6c01a4c8cac5aa2f13b9a66885668ac482cc0c513f73c56495e5",
              "fineweb2_source_revision": "af9c13333eb981300149d5ca60a8e9d659b276b9",
              "fineweb2_expected_sha256": "26ae4e654770b07e24a4ef6b8ef3a01c84076a920f1922ac014364ab411b84f0",
              "normalized_word_rows": len(full_counts),
              "sample_entries_preserved": len(sample_counts),
              "sample_missing_entries": len(missing),
              "sample_count_mismatches": len(mismatched),
              "bigram_rows": bigram_count,
              "lexicon_bytes": lexicon.stat().st_size,
              "bigrams_bytes": bigrams.stat().st_size,
              "frequency_table_bytes": len(frequency_bytes),
              "frequency_table_gzip_bytes": len(gzip.compress(frequency_bytes, compresslevel=9, mtime=0)),
              "lexicon_sha256": hashlib.sha256(lexicon.read_bytes()).hexdigest(),
              "bigrams_sha256": hashlib.sha256(bigrams.read_bytes()).hexdigest(),
              "frequency_table_sha256": hashlib.sha256(frequency_bytes).hexdigest(),
              "status": "BUILD_VERIFIED"
          }
          (output / "build-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit compact frequency table to the feature branch
        if: github.ref_name != 'main'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cp "$RUNNER_TEMP/khmer-full-build/segmentation-frequency.tsv" data/khmer/google-pronunciation-full-frequency.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khmer/google-pronunciation-full-frequency.tsv
          if ! git diff --cached --quiet; then
            git commit -m "data: add full Khmer segmentation frequency table"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upload reproducible full lexicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: khmer-full-lexicon-build
          path: ${{ runner.temp }}/khmer-full-build/
          if-no-files-found: error
          retention-days: 14
