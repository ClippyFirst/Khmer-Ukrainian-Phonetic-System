name: Deploy site to GitHub Pages

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-google-teacher.txt

      - name: Restore offline Google Khmer teacher checkpoint
        id: google-teacher-cache
        uses: actions/cache@v4
        with:
          path: .cache/google-khmer-teacher/teacher.pt
          key: google-khmer-teacher-${{ runner.os }}-${{ hashFiles('data/khmer/google-pronunciation-full.tsv', 'scripts/train_google_phonemic_teacher.py', 'scripts/google_teacher/**', 'scripts/distill_google_teacher.py', 'src/khmer_ua/google_phonemic.py', 'src/khmer_ua/google_teacher_data.py', 'src/khmer_ua/orthographic_syllables.py', 'requirements-google-teacher.txt') }}

      - name: Install pinned CPU-only Google Khmer teacher runtime
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-google-teacher.txt && python -m pip install jsonschema==4.26.0

      - name: Train Google Khmer phonemic teacher when cache is cold
        if: steps.google-teacher-cache.outputs.cache-hit != 'true'
        run: python scripts/train_google_phonemic_teacher.py --epochs 12 --batch-size 192 --embedding-size 96 --hidden-size 128 --output-dir .cache/google-khmer-teacher

      - name: Distill teacher into static deterministic OOV syllable candidates
        run: python scripts/distill_google_teacher.py --checkpoint .cache/google-khmer-teacher/teacher.pt --output-dir .cache/google-khmer-teacher --batch-size 192

      - name: Validate static deterministic candidate artifact and evidence limits
        run: python scripts/validate_google_distilled_syllables.py .cache/google-khmer-teacher/distilled-syllables.json

      - name: Stage deterministic OOV candidate table for the browser
        run: |
          mkdir -p public/data
          cp .cache/google-khmer-teacher/distilled-syllables.json public/data/google-neural-distilled-syllables.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web checks
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise production site in Chromium
        run: npm run test:browser

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed site and runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/system.html" -o /tmp/system.html
          grep -q 'id="source"' /tmp/index.html
          grep -q 'type="module"' /tmp/index.html
          grep -q '<title>' /tmp/system.html
          script_src="$(grep -oE 'src="[^"]+\.js"' /tmp/index.html | head -n1 | cut -d'"' -f2)"
          css_src="$(grep -oE 'href="[^"]+\.css([?][^"]*)?"' /tmp/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$script_src" && test -n "$css_src"
          case "$script_src" in http*) script_url="$script_src" ;; /*) script_url="$base$script_src" ;; *) script_url="$base/${script_src#./}" ;; esac
          case "$css_src" in http*) css_url="$css_src" ;; /*) css_url="$base$css_src" ;; *) css_url="$base/${css_src#./}" ;; esac
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$script_url" -o /tmp/main.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$css_url" -o /tmp/styles.css
          test -s /tmp/main.js && test -s /tmp/styles.css
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/data/google-neural-distilled-syllables.json" -o /tmp/google-neural-distilled-syllables.json
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("/tmp/google-neural-distilled-syllables.json").read_text(encoding="utf-8"))
          assert artifact.get("schema") == "google-khmer-neural-distilled-syllables/v1"
          accepted = len(artifact.get("candidates", []))
          rejected = sum(artifact.get("rejected", {}).values())
          assert accepted + rejected == artifact["inventory"]["oov_syllable_candidates"]
          assert accepted > 0
          print("deployed deterministic OOV table:", accepted, "accepted candidates;", rejected, "rejected")
          PY
